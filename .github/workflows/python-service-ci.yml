name: python-service-ci

"on":
  workflow_call:
    inputs:
      image-name:
        description: "Image name without registry"
        required: true
        type: string
      python-version:
        description: "Python version"
        type: string
        default: "3.12"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose

  lint-and-test:
    runs-on : ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bmf
          POSTGRES_PASSWORD: bmf
          POSTGRES_DB: listings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmf -d listings_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://bmf:bmf@localhost:5432/listings_test
        run: pytest -v

  build-scan-push:
    needs : [secret-scan, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Image(Local Only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: scan-target:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:local
          severity: CRITICAL,High
          ignore-unfixed: true
          exit-code: 1

      - name: Login to Github Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

    